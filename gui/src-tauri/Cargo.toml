[package]
name = "followme-gui"
version = "0.1.0"
description = "Desktop GUI wrapper for GitHub Async Growth Bot"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.6", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
tokio = { version = "1.28", features = ["full"] }
once_cell = "1.17"
